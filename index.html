<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 2 : Interactive Registration Form</title>
    <script src="./script.js" defer></script>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div class="container">
        <h1>Register</h1>
        <form id="registrationForm" novalidate>
            <div class="form-group">
                <label for="username">Username:</label>
                <input type="text" id="username" name="username">
                <span class="error-message" id="usernameError"></span>
            </div>
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
                <span class="error-message" id="emailError"></span>

            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password">
                <ul class="password-requirements" id="passwordRequirements">
                    <li id="req-length">At least 8 characters</li>
                    <li id="req-uppercase">Contains an uppercase letter</li>
                    <li id="req-lowercase">Contains a lowercase letter</li>
                    <li id="number">Contains a number</li>
                </ul>
                <span class="error-message" id="passwordError"></span>
                <span class="show-password hide" data-password-toggle="false"></span>
            </div>
            <div class="form-group">
                <label for="confirmPassword">Confirm Password:</label>
                <input type="password" id="confirmPassword" name="confirmPassword">
                <span class="error-message" id="confirmPasswordError"></span>
                <span class="show-password hide" data-password-toggle="false">

                </span>
            </div>
            <button type="submit">Register</button>
        </form>
    </div>
</body>

</html>
